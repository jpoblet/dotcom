# Questions suggested on the empty chat. Work and career first: most
# visitors come for that. The agent suggests personal topics later, in its
# follow-ups. Keep them short, written as a visitor would ask, and
# answerable from /content.
starter_questions:
  - Where have you worked?
  - What are you building right now?
  - How did you get into product design?
  - What is AthleteID?
  - Tell me about the Glovo courier app
  - What do you mean by product builder?
  - What tools do you use?
  - How do you think about design constraints?
  - What was it like being the first designer at Rillet?
  - What does a Lead Product Designer do at Veriff?
  - What is Legend Numbers?
  - Tell me about What The Flag
  - How do you work with engineers?
  - Do you code as well as design?
  - What's your design process like?

# The home page reads "Ask me about ___" and types these into the blank, one
# after another. `about` finishes that sentence; `question` is what gets
